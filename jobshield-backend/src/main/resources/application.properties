# ===============================
# Application Configuration
# ===============================
spring.application.name=jobshield-backend

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8080}

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/jobshield_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Gemini AI Configuration
# ===============================
gemini.api.key=${GEMINI_API_KEY:${GCP_API_KEY:}}

# ===============================
# Multipart File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


